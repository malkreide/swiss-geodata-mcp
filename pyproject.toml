[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-geodata-mcp"
version = "0.1.0"
description = "MCP server for the Swiss federal geodata (geo.admin.ch) — layer discovery, spatial identify, zoning, heights, coordinate conversion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "malkreide" }]
keywords = ["mcp", "model-context-protocol", "llm", "swiss-open-data", "geodata", "geo-admin", "swisstopo", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
swiss-geodata-mcp = "swiss_geodata_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/malkreide/swiss-geodata-mcp"
Repository = "https://github.com/malkreide/swiss-geodata-mcp"
Issues = "https://github.com/malkreide/swiss-geodata-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_geodata_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: tests against real upstream services (excluded from CI)"]

[tool.ruff]
line-length = 100
target-version = "py310"
